<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "GQ Sans"; src: url("../assets/fonts/gq-sans.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "GQ Serif"; src: url("../assets/fonts/gq-serif.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "GQ Mono"; src: url("../assets/fonts/gq-mono.woff2") format("woff2"); font-weight: 400; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
<script src="../src/lib/mv.js"></script>
<script src="../src/lib/gx.js"></script>
<script src="../src/lib/world.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Bilibili covers for 「勾指起誓」. ?r=169 | 43 | 34. Same flat poster language and engine as the MV.
var R = new URLSearchParams(location.search).get('r') || '169';
var SIZE = { '169': [1920, 1080], '43': [1440, 1080], '34': [1080, 1440] }[R];
var c = document.getElementById('c'); c.width = SIZE[0]; c.height = SIZE[1];
var g = c.getContext('2d'), P = GX.P, Wc = SIZE[0], Hc = SIZE[1];
GX.S = { canvas: function (w, h) { var k = document.createElement('canvas'); k.width = w; k.height = h; return k; } };
function load(s) { return new Promise(function (r) { var i = new Image(); i.onload = function () { r(i); }; i.src = s; }); }

// a tilted window holding a bust (fills the width, hangs from the top so the face is always in)
function win(img, x, y, w, h, rot, o) {
  g.save(); g.translate(x + w / 2, y + h / 2); g.rotate(rot); g.translate(-(x + w / 2), -(y + h / 2));
  GX.panel(g, x, y, w, h, { title: o.title, bg: o.bg, bar: 52, r: 22, frame: o.frame, titleCol: P.cream, dots: [P.terra, P.apricot, P.peri], shadowCol: 'rgba(59,38,32,0.22)' }, function (g, ix, iy, iw, ih) {
    GX.circle(g, ix + iw / 2, iy + ih * 0.42, Math.min(iw, ih) * 0.44, o.circle);
    var ww = iw * (o.scale || 1.05), hh = ww * img.naturalHeight / img.naturalWidth;
    GX.cut(g, img, { x: ix + iw / 2 + (o.ox || 0), y: iy + (o.oy == null ? 8 : o.oy), h: hh, ay: 0 });
  });
  g.restore();
}
function thread(x1, y1, x2, y2, sag) {
  g.save(); g.lineCap = 'round';
  var path = function () { g.beginPath(); g.moveTo(x1, y1); g.bezierCurveTo(x1 + (x2 - x1) * 0.3, y1 + sag, x1 + (x2 - x1) * 0.7, y2 + sag, x2, y2); };
  g.strokeStyle = 'rgba(243,201,105,0.45)'; g.lineWidth = 22; path(); g.stroke();
  g.strokeStyle = P.gold; g.lineWidth = 8; path(); g.stroke();
  g.restore();
}
function title(cx, y, size, gap) {
  var chars = ['勾', '指', '起', '誓'], cols = [P.espresso, P.espresso, P.navy, P.navy], x0 = cx - gap * 1.5;
  for (var i = 0; i < 4; i++) GX.text(g, chars[i] + '.', x0 + i * gap, y, { size: size, font: 'serif', w: 900, color: cols[i], align: 'center' });
  var lw = gap * 0.9, ly = y - size * 0.36;
  GX.rect(g, P.espresso, x0 - gap * 0.75 - lw, ly, lw, Math.max(4, size / 26));
  GX.rect(g, P.navy, x0 + gap * 3 + gap * 0.75, ly, lw, Math.max(4, size / 26));
}
function counter(x, y, size) {
  var to = { size: size, font: 'sans', w: 700 }, s = '第 215 次初次见面', w = GX.measure(g, s, to) + size * 1.6, h = size * 1.9;
  g.fillStyle = 'rgba(0,0,0,0.25)'; GX.rr(g, x - w / 2 + 8, y + 10, w, h, h / 2); g.fill();
  g.fillStyle = P.navy; GX.rr(g, x - w / 2, y, w, h, h / 2); g.fill();
  GX.text(g, s, x, y + h * 0.68, { size: size, font: 'sans', w: 700, color: P.cream, align: 'center' });
}
function background() {
  GX.rect(g, P.cream, 0, 0, Wc, Hc);
  g.fillStyle = 'rgba(59,38,32,0.06)';
  for (var y = 24; y < Hc; y += 48) for (var x = 24; x < Wc; x += 48) g.fillRect(x, y, 3, 3);
}
function sparks(seed, n, box) {
  var r = MV.rng(seed);
  for (var i = 0; i < n; i++) GX.star(g, box[0] + r() * box[2], box[1] + r() * box[3], 8 + r() * 16, i % 3 ? P.gold : P.terra);
}

Promise.all([load('../assets/poses/cut/C17.png'), load('../assets/poses/cut/D13.png'),
  document.fonts.load('900 40px "GQ Serif"'), document.fonts.load('700 40px "GQ Sans"'), document.fonts.load('400 20px "GQ Mono"')]).then(function (a) {
  var C = a[0], D = a[1];
  background();
  var CW = { title: 'claude', bg: P.apricot, circle: P.cream, frame: P.espresso };
  var DW = { title: 'deepseek', bg: P.peri, circle: P.cream, frame: P.navy, scale: 1.01, oy: 0 }; // a touch smaller so her whole fist shows
  if (R === '169') {
    GX.circle(g, 330, 250, 300, P.apricot); GX.circle(g, 1600, 720, 300, P.peri);
    sparks(7, 12, [120, 60, 1680, 760]);
    win(C, 190, 90, 600, 720, -0.035, CW);
    win(D, 1130, 100, 600, 720, 0.035, DW);
    thread(790, 470, 1130, 450, 110);
    GX.star(g, 960, 548, 30, P.gold); GX.star(g, 1010, 520, 14, P.gold); GX.star(g, 905, 525, 12, P.gold);
    counter(960, 40, 34);
    title(960, 990, 128, 220);
    GX.star(g, 90, 90, 26, P.terra); GX.rect(g, P.terra, 88, 136, 4, 180);
  } else if (R === '43') {
    GX.circle(g, 250, 230, 260, P.apricot); GX.circle(g, 1220, 700, 260, P.peri);
    sparks(8, 10, [80, 60, 1280, 700]);
    win(C, 100, 100, 540, 660, -0.035, CW);
    win(D, 800, 110, 540, 660, 0.035, DW);
    thread(640, 470, 800, 455, 90);
    GX.star(g, 720, 532, 26, P.gold);
    counter(720, 30, 30);
    title(720, 980, 118, 196);
  } else {
    GX.circle(g, 250, 330, 280, P.apricot); GX.circle(g, 860, 1060, 280, P.peri);
    sparks(9, 12, [60, 80, 960, 1000]);
    win(C, 60, 130, 540, 660, -0.04, CW);
    win(D, 480, 600, 540, 660, 0.04, DW);
    thread(598, 430, 905, 608, -40);
    GX.star(g, 790, 470, 26, P.gold);
    counter(540, 34, 32);
    title(540, 1385, 104, 182);
  }
  document.title = 'ready';
});
</script>
</body></html>
