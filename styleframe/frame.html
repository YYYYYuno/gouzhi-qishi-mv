<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Style frame for 「勾指起誓」: everything here is code except the two character cutouts.
// Query: ?claude=../assets/design/cut/claude-a.png&ds=../assets/design/cut/ds-1.png
const q = new URLSearchParams(location.search);
const SRC = { claude: q.get('claude'), ds: q.get('ds') };
const W = 1920, H = 1080, HORIZON = 640;
const c = document.getElementById('c'), g = c.getContext('2d');
const ORANGE = '#D97757', BLUE = '#4D6BFE', GOLD = '#F3C969';

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });

function sky() {
  const gr = g.createLinearGradient(0, 0, 0, HORIZON);
  gr.addColorStop(0, '#1a1a1f'); gr.addColorStop(1, '#3a3a41');
  g.fillStyle = gr; g.fillRect(0, 0, W, HORIZON);
  // stars
  for (let i = 0; i < 140; i++) { const a = rnd() * 0.5 + 0.1; g.fillStyle = `rgba(230,228,220,${a})`; g.fillRect(rnd() * W, rnd() * (HORIZON - 120), 2, 2); }
  // moon
  g.save(); g.shadowColor = 'rgba(240,238,230,.35)'; g.shadowBlur = 60;
  g.fillStyle = '#e9e6de'; g.beginPath(); g.arc(1540, 190, 62, 0, Math.PI * 2); g.fill(); g.restore();
  // flat cloud bands
  g.fillStyle = 'rgba(70,70,78,.8)';
  for (let k = 0; k < 3; k++) { const y = 420 + k * 60; g.beginPath(); g.moveTo(0, y + 40);
    for (let x = 0; x <= W; x += 60) g.lineTo(x, y + Math.sin(x * 0.011 + k * 2) * 14 - (rnd() * 10)); g.lineTo(W, y + 80); g.lineTo(0, y + 80); g.fill(); g.fillStyle = `rgba(${78 + k * 8},${78 + k * 8},${86 + k * 8},.85)`; }
}

function sea() {
  const gr = g.createLinearGradient(0, HORIZON, 0, H);
  gr.addColorStop(0, '#1d2a66'); gr.addColorStop(0.35, '#101a48'); gr.addColorStop(1, '#05081a');
  g.fillStyle = gr; g.fillRect(0, HORIZON, W, H - HORIZON);
  // horizontal wave strokes
  for (let i = 0; i < 90; i++) {
    const y = HORIZON + Math.pow(rnd(), 1.6) * (H - HORIZON); const len = 30 + rnd() * 160 * (1 + (y - HORIZON) / 300);
    g.strokeStyle = `rgba(169,184,255,${0.06 + rnd() * 0.12})`; g.lineWidth = 1 + (y - HORIZON) / 220;
    const x = rnd() * W; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
  }
  // deep glow under the water where DeepSeek rises
  const gl = g.createRadialGradient(1290, 760, 10, 1290, 760, 420);
  gl.addColorStop(0, 'rgba(77,107,254,.55)'); gl.addColorStop(1, 'rgba(77,107,254,0)');
  g.fillStyle = gl; g.fillRect(800, HORIZON, 1000, H - HORIZON);
  // bioluminescent specks
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(169,184,255,${rnd() * 0.6})`; g.beginPath(); g.arc(900 + rnd() * 800, HORIZON + 80 + rnd() * 360, 1 + rnd() * 2, 0, 7); g.fill(); }
}

function shelf(x, y, w, h) {
  // a lit bookcase: rows of spines, mostly neutral, a few in Claude orange
  g.fillStyle = '#2a1b14'; g.fillRect(x, y, w, h);
  const rowH = 46;
  for (let ry = y + 8; ry + rowH - 8 < y + h; ry += rowH) {
    let bx = x + 6;
    while (bx < x + w - 10) { const bw = 6 + rnd() * 12, warm = rnd(), bh = rowH - 10 - rnd() * 10;
      g.fillStyle = warm > .78 ? ORANGE : warm > .45 ? '#b9ad9e' : warm > .2 ? '#7a6d63' : '#4b413b';
      g.fillRect(bx, ry + (rowH - 8 - bh), bw - 2, bh); bx += bw; }
    g.fillStyle = '#140d09'; g.fillRect(x, ry + rowH - 8, w, 6);
  }
}

function library() {
  // the library rises out of the water on the left; its great arched door is lit and full of books
  const x = -40, w = 820, top = -20, base = HORIZON + 6;
  g.fillStyle = '#131316'; g.fillRect(x, top, w, base - top);
  // pilasters + cornice lines
  g.fillStyle = '#1b1b20'; for (const px of [70, 250, 540, 720]) g.fillRect(px, top, 26, base - top);
  g.fillRect(x, 150, w, 10); g.fillRect(x, 54, w, 6);
  // upper windows
  for (const wx of [118, 590]) { g.fillStyle = 'rgba(217,119,87,.16)'; g.fillRect(wx - 8, 190, 116, 190); shelf(wx, 198, 100, 174); }
  // arched doorway with warm light spilling out
  const dx = 300, dw = 220, dTop = 230;
  const halo = g.createRadialGradient(dx + dw / 2, base - 120, 20, dx + dw / 2, base - 120, 420);
  halo.addColorStop(0, 'rgba(217,119,87,.28)'); halo.addColorStop(1, 'rgba(217,119,87,0)');
  g.fillStyle = halo; g.fillRect(dx - 400, dTop - 200, dw + 800, base - dTop + 260);
  g.save(); g.beginPath(); g.moveTo(dx, base); g.lineTo(dx, dTop + dw / 2); g.arc(dx + dw / 2, dTop + dw / 2, dw / 2, Math.PI, 0); g.lineTo(dx + dw, base); g.closePath(); g.clip();
  g.fillStyle = '#3a2418'; g.fillRect(dx, dTop, dw, base - dTop); shelf(dx + 10, dTop + 20, dw - 20, base - dTop - 40);
  const inner = g.createLinearGradient(0, dTop, 0, base); inner.addColorStop(0, 'rgba(255,200,150,.10)'); inner.addColorStop(1, 'rgba(255,170,110,.35)');
  g.fillStyle = inner; g.fillRect(dx, dTop, dw, base - dTop); g.restore();
  // terrace / steps into the sea
  g.fillStyle = '#0d0d10'; g.fillRect(x, base - 8, w + 120, 18); g.fillStyle = '#18181c'; g.fillRect(x, base - 10, w + 120, 3);
  // orange reflection of the door
  g.save(); g.fillStyle = ORANGE;
  for (let i = 0; i < 30; i++) { const yy = base + 18 + i * 10; g.globalAlpha = .32 - i * .009; const ww = dw * (0.9 - rnd() * 0.5); g.fillRect(dx + dw / 2 - ww / 2 + (rnd() - .5) * 30, yy, ww, 2); }
  g.restore();
}

function drawCut(img, cx, footY, height, clipY) {
  if (!img) return;
  const s = height / img.height, w = img.width * s;
  g.save();
  if (clipY) { g.beginPath(); g.rect(0, 0, W, clipY); g.clip(); }
  g.drawImage(img, cx - w / 2, footY - height, w, height);
  g.restore();
  return { x: cx - w / 2, y: footY - height, w, h: height };
}

function goldThread(x1, y1, x2, y2) {
  g.save(); g.lineCap = 'round';
  for (const [lw, a, blur] of [[14, .18, 40], [6, .45, 18], [2.5, 1, 0]]) {
    g.shadowColor = GOLD; g.shadowBlur = blur; g.strokeStyle = `rgba(243,201,105,${a})`; g.lineWidth = lw;
    g.beginPath(); g.moveTo(x1, y1); g.bezierCurveTo(x1 + 180, y1 + 140, x2 - 220, y2 + 160, x2, y2); g.stroke();
  }
  for (let i = 0; i < 40; i++) { const t = rnd(); const px = x1 + (x2 - x1) * t + (rnd() - .5) * 40, py = y1 + (y2 - y1) * t + 110 * Math.sin(Math.PI * t) + (rnd() - .5) * 30;
    g.fillStyle = `rgba(255,230,160,${rnd()})`; g.beginPath(); g.arc(px, py, rnd() * 2.2, 0, 7); g.fill(); }
  g.restore();
}

function waterline(x, w) {
  // ripples where DeepSeek breaks the surface
  g.save(); g.strokeStyle = 'rgba(200,210,255,.55)'; g.lineWidth = 2;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.ellipse(x, HORIZON + 34 + i * 3, w * (0.35 + i * 0.18), 10 + i * 5, 0, 0, Math.PI * 2); g.globalAlpha = .6 - i * .13; g.stroke(); }
  g.restore();
}

function ui() {
  g.save();
  // terminal snippet, between the two of them
  const bx = 800, by = 70;
  g.fillStyle = 'rgba(10,10,12,.72)'; g.fillRect(bx, by, 520, 120); g.strokeStyle = 'rgba(255,255,255,.12)'; g.strokeRect(bx + .5, by + .5, 520, 120);
  g.font = '24px Consolas, monospace'; g.fillStyle = '#8a8a90'; g.fillText('>', bx + 22, by + 42);
  g.fillStyle = '#e8e4da'; g.fillText('const 约定 = new Promise(…)', bx + 46, by + 42);
  g.fillStyle = '#8a8a90'; g.fillText('<', bx + 22, by + 90); g.fillStyle = GOLD; g.fillText('Promise {<pending>}', bx + 46, by + 90);
  // counter, top-right
  g.font = '22px "Microsoft YaHei", sans-serif'; g.textAlign = 'right'; g.fillStyle = 'rgba(232,228,218,.85)';
  g.fillText('第 1 次初次见面', W - 70, 92);
  g.fillStyle = BLUE; g.fillRect(W - 250, 106, 180, 3);
  // DeepSeek thinking chip
  g.textAlign = 'left';
  const tx = 1470, ty = 250; g.fillStyle = 'rgba(245,246,255,.92)'; roundRect(tx, ty, 340, 52, 26); g.fill();
  g.fillStyle = BLUE; g.beginPath(); g.arc(tx + 28, ty + 26, 9, 0, 7); g.fill();
  g.fillStyle = '#3c3f55'; g.font = '22px "Microsoft YaHei", sans-serif'; g.fillText('已深度思考（用时 37 秒）', tx + 50, ty + 34);
  g.strokeStyle = '#3c3f55'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(tx + 306, ty + 22); g.lineTo(tx + 313, ty + 29); g.lineTo(tx + 320, ty + 22); g.stroke();
  g.restore();
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function grain() {
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

(async () => {
  const [ci, di] = await Promise.all([load(SRC.claude), load(SRC.ds)]);
  sky(); sea(); library();
  // hand anchors are fractions of each cutout (?ch=x,y&dh=x,y), measured per design
  const ch = (q.get('ch') || '0.75,0.52').split(',').map(Number), dh = (q.get('dh') || '0.71,0.29').split(',').map(Number);
  const cr = drawCut(ci, 410, HORIZON - 4, 470);
  waterline(1330, 250);
  const dr = drawCut(di, 1330, HORIZON + 300, 720, HORIZON + 36);
  if (cr && dr) goldThread(cr.x + cr.w * ch[0], cr.y + cr.h * ch[1], dr.x + dr.w * dh[0], dr.y + dr.h * dh[1]);
  ui(); grain();
  document.title = 'ready';
})();
</script>
</body></html>
