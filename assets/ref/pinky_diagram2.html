<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1536" height="1024"></canvas>
<script>
// Pose diagram v2 for the pinky swear: the two fists almost touch, the little fingers are SHORT and THICK,
// each bent into a small hook, interlocked. Thumb on top of each fist, three curled fingers on the front.
var c = document.getElementById('c'), g = c.getContext('2d');
var INK = '#2B2B2B', SKIN = '#F4F1EA', LW = 7;
g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 1536, 1024);
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shape(fill) { g.fillStyle = fill; g.fill(); g.lineWidth = LW; g.strokeStyle = INK; g.stroke(); }
function path(fn, w, fill) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  [[w + LW * 2, INK], [w, fill]].forEach(function (s) { g.beginPath(); fn(); g.lineWidth = s[0]; g.strokeStyle = s[1]; g.stroke(); });
}
function fist(cx, cy, dir, sleeve, cuff) {
  g.save(); g.translate(cx, cy); g.scale(dir, 1);
  rr(-900, -96, 650, 192, 10); shape(sleeve);
  rr(-300, -110, 110, 220, 18); shape(cuff);
  rr(-205, -112, 245, 226, 66); shape(SKIN);               // back of the hand
  [-104, -46, 12].forEach(function (y) { rr(-20, y, 132, 56, 28); shape(SKIN); }); // index, middle, ring: curled
  path(function () { g.moveTo(-150, -112); g.quadraticCurveTo(-40, -118, 64, -86); }, 46, SKIN); // thumb along the top
  g.restore();
}
var L = 622, R = 914, Y = 440, D = 44;                    // right fist sits D px lower, so the hooks interlock
var y1 = Y + 92, y2 = Y + D + 92, xa = 790, xb = 746;     // little-finger rows, hook columns
fist(L, Y, 1, '#8A8A8A', '#CFCFCF');
fist(R, Y + D, -1, '#3A3A3A', '#CFCFCF');
var W = 44;
// proximal parts of both little fingers, out of the bottom of each fist
path(function () { g.moveTo(L + 30, y1); g.lineTo(xa - 6, y1); }, W, SKIN);
path(function () { g.moveTo(R - 30, y2); g.lineTo(xb + 6, y2); }, W, SKIN);
// left hook bends DOWN in front of the right finger; right hook bends UP in front of the left finger
path(function () { g.moveTo(xa - 20, y1); g.quadraticCurveTo(xa + 14, y1, xa + 10, y1 + 34); g.quadraticCurveTo(xa + 4, y2 + 26, xa - 22, y2 + 30); }, W, SKIN);
path(function () { g.moveTo(xb + 20, y2); g.quadraticCurveTo(xb - 14, y2, xb - 10, y2 - 34); g.quadraticCurveTo(xb - 4, y1 - 26, xb + 22, y1 - 30); }, W, SKIN);
document.title = 'ready';
</script></body></html>
