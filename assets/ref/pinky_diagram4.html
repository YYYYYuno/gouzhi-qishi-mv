<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1536" height="1024"></canvas>
<script>
// Pose diagram v4: the classic pinky-promise picture. Two forearms rise from the bottom edge and lean toward each
// other. Each hand shows its palm: index, middle and ring fingers folded down (their nails show), the thumb sticks up
// on the OUTER side, the little finger sticks up on the INNER side, and the two little fingers hook at the top centre.
var c = document.getElementById('c'), g = c.getContext('2d');
var INK = '#2B2B2B', SKIN = '#F4F1EA', NAIL = '#E2DCCF', LW = 6;
g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 1536, 1024);
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fs(fill) { g.fillStyle = fill; g.fill(); g.lineWidth = LW; g.strokeStyle = INK; g.stroke(); }
function tube(fn, w, fill) { g.lineCap = 'round'; g.lineJoin = 'round'; [[w + LW * 2, INK], [w, fill]].forEach(function (s) { g.beginPath(); fn(); g.lineWidth = s[0]; g.strokeStyle = s[1]; g.stroke(); }); }
// one hand in local coords: palm centred at 0,0, wrist down (+y), thumb at -x (outer), little finger at +x (inner)
function hand(cx, cy, ang, dir, sleeveCol, pinkyEnd) {
  g.save(); g.translate(cx, cy); g.rotate(ang); g.scale(dir, 1);
  // forearm + cuff, running off the bottom edge
  g.beginPath(); g.moveTo(-74, 90); g.lineTo(74, 90); g.lineTo(96, 900); g.lineTo(-96, 900); g.closePath(); fs(SKIN);
  rr(-104, 150, 208, 760, 14); fs(sleeveCol); rr(-112, 130, 224, 90, 16); fs('#CFCFCF');
  // thumb up on the outer side
  tube(function () { g.moveTo(-70, 40); g.quadraticCurveTo(-112, -20, -112, -112); }, 50, SKIN);
  // palm
  rr(-92, -64, 184, 196, 60); fs(SKIN);
  // index, middle, ring folded down over the palm: three rounded tops with the nails showing
  [-62, -10, 42].forEach(function (x, i) {
    rr(x - 26, -96 + (i === 1 ? -6 : 0), 52, 96, 26); fs(SKIN);
    g.beginPath(); g.ellipse(x, -18 + (i === 1 ? -6 : 0), 15, 18, 0, 0, Math.PI * 2); fs(NAIL);
  });
  g.restore();
  // little finger: from the inner top corner of the palm, up and over into the hook (drawn in page coords)
  var a = Math.cos(ang), b = Math.sin(ang), bx = 74 * dir, by = -60;
  var base = [cx + bx * a - by * b, cy + bx * b + by * a];
  tube(function () { g.moveTo(base[0], base[1]); g.quadraticCurveTo(pinkyEnd[0], pinkyEnd[1] - 40, pinkyEnd[2], pinkyEnd[3]); }, 40, SKIN);
}
var CX = 768, HY = 488; // hook point, just above the palms: short little fingers
hand(662, 640, 0.14, 1, '#8A8A8A', [CX - 4, HY - 6, CX + 22, HY + 22]);    // left: little finger arcs over and down into the hook
hand(874, 652, -0.14, -1, '#3A3A3A', [CX + 4, HY + 8, CX - 22, HY + 36]);  // right: little finger arcs over from the other side
// redraw the left finger's tip on top so the two read as linked
tube(function () { g.moveTo(CX + 6, HY - 4); g.quadraticCurveTo(CX + 20, HY + 6, CX + 22, HY + 22); }, 40, SKIN);
document.title = 'ready';
</script></body></html>
